name: Bug 报告
description: 游戏崩溃、无法启动或功能异常
title: "[Bug] "
labels: ["bug"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        请尽量填写完整，并上传完整日志。

  - type: input
    id: rte-version
    attributes:
      label: RTE 版本
      placeholder: 1.0.0-beta.3
    validations:
      required: true

  - type: dropdown
    id: loader
    attributes:
      label: 加载器
      options:
        - Fabric
        - Forge
    validations:
      required: true

  - type: input
    id: loader-version
    attributes:
      label: 加载器版本
      placeholder: Fabric Loader 0.16.9 / Forge 47.4.12
    validations:
      required: true

  - type: input
    id: minecraft-version
    attributes:
      label: Minecraft 版本
      placeholder: 1.20.1
    validations:
      required: true

  - type: input
    id: mtr-version
    attributes:
      label: MTR 版本
      placeholder: 4.0.5
    validations:
      required: true

  - type: input
    id: java-version
    attributes:
      label: Java 版本
      placeholder: 21.0.12
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: 运行环境
      options:
        - 单人游戏
        - 多人游戏客户端
        - 专用服务端
    validations:
      required: true

  - type: textarea
    id: addons
    attributes:
      label: 同时安装的 MTR 附属
      description: 请列出 JCM、方速、S1MTR、MSD、NTE 等附属及版本。
      placeholder: |
        JCM 2.2.3
        MSD 1.4.5
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 进入世界
        2. 执行操作
        3. 出现问题
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 完整日志
      description: 请拖入 logs/latest.log；如果生成了 crash-reports，请一并上传。
    validations:
      required: true

  - type: checkboxes
    id: confirmation
    attributes:
      label: 确认
      options:
        - label: 我正在使用最新版 RTE。
          required: true
        - label: 我已搜索现有 Issue，确认没有重复报告。
          required: true
        - label: 我已尝试只使用 MTR 和 RTE 复现。
          required: false
