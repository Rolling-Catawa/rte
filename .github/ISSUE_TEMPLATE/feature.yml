name: 功能建议
description: 建议新功能或现有功能改进
title: "[Feature] "
labels: ["enhancement"]
assignees: []
body:
  - type: textarea
    id: problem
    attributes:
      label: 需要解决的问题
      description: 请描述使用场景和当前限制。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 已尝试的替代方案
    validations:
      required: false
